<h3>Faça seu login</h3>
<div class="alert alert-warning"><strong>Verifique!</strong> E-mail ou senha incorretos!</div>
<div class="row">   
    <div class="col">
    <label class="form-label">E-mail:</label>
    <input type="email" id="email"  class="form-control">
    <label  class="form-label">Senha:</label>
    <input type="senha" id="senha"  class="form-control"><br>
    <button class="btn btn-outline-success w-100">Entrar</button>
    </div>
    <div  class="col">
    <label class="form-label">Ainda não tenho cadastro:</label><br>
    <a href="cadastro" class="btn btn-outline-primary w-100">Faça seu novo cadastro</a>
    <br>
    <label class="form-label">Esqueci minha senha:</label><br>
    <a href="reenvio" class="btn btn-outline-danger w-100">Esqueci minha senha</a>
    </div>
</div>
