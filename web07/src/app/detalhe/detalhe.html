<div class="row">
    <div class="col-6 card">
        <img src="{{obj.codigo}}.jpg" class="card-img-top" width="400px"><br>
    </div>
    <div class="col-6 card">
        <div class="card-body">
            <h4 class="card-title">{{obj.nome}}</h4>
            <div class="card-text">
                {{obj.descritivo}}
                <br><br>
            </div>
            <div class="card-text" *ngIf="obj.valorPromo > 0">
                de: R$ {{obj.valor}}<br>
                por: R$ {{obj.valorPromo}}<br>
            </div>
            <div class="card-text" *ngIf="obj.valorPromo==0">
                por: R$ {{obj.valor}}<br>
            </div>
            <button class="btn btn-success w-50" *ngIf="obj.estoque>0">Comprar</button>
        </div>
    </div>
</div>
